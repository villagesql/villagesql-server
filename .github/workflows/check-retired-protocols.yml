name: Check Retired Protocols

# PR validation checks only the lines a PR adds, against the main it was last
# validated with. A PR whose checks passed before a protocol roll can still
# merge a reference to the version that roll retired, so check main's whole
# tree after every push.

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    name: Check for retired protocol versions
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Check for retired protocol versions
      run: ./scripts/check_retired_protocols.sh
