name: Release Server Branch

# Builds the dev-server package for ALL target platforms by fanning out over
# build-server-branch (one call per target), then attaches the resulting
# tarballs to an existing GitHub Release.
#
# This workflow handles the multi-target case only; single-target builds live
# in build-server-branch.
#
# The set of targets is a data table, villagesql/bld_matrix/json_platforms.sh,
# so the choices and their parameters can be read and run outside CI.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git tag, branch, or SHA to build from.'
        required: true
        type: string
      release_tag:
        description: 'GitHub Release to attach artifacts to. Defaults to "ref". Blank to skip upload.'
        required: false
        type: string
        default: ''
      release_build:
        description: 'Strip the -dev suffix from the version.'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag, branch, or SHA to build from (e.g. 0.0.4 or main).'
        required: true
        type: string
        default: 'main'
      release_tag:
        description: 'GitHub Release to attach artifacts to. Defaults to "ref". Leave blank to skip upload (useful for test builds — artifacts are still available for download from the Actions run page).'
        required: false
        type: string
        default: ''
      release_build:
        description: 'Release build: strip the -dev suffix from the version. Leave unchecked to include -dev (safe default).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report-parameters:
    name: Report Parameters
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.platforms.outputs.build-matrix }}

    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 1
        sparse-checkout: villagesql/bld_matrix/
        ref: ${{ inputs.ref }}

    - name: Report Parameters
      run: |
        echo "Git Rev: ${{ inputs.ref }}"
        echo "Git SHA1: $(git rev-parse HEAD)"
        echo "Git Commit: $(git log -n1 --oneline)"
        echo "Release Tag: ${{ inputs.release_tag }}"
        echo "Release Build: ${{ inputs.release_build }}"

    - name: Read platform table
      id: platforms
      run: echo "build-matrix=$(villagesql/bld_matrix/json_build_matrix.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: report-parameters
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.report-parameters.outputs.build-matrix) }}
    uses: ./.github/workflows/build-server-branch.yml
    with:
      ref: ${{ inputs.ref }}
      platform: ${{ matrix.platform }}
      release_build: ${{ inputs.release_build }}

  attach-release-artifacts:
    name: Attach Release Artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine release tag
        id: tag
        run: echo "tag=${{ inputs.release_tag || inputs.ref }}" >> "$GITHUB_OUTPUT"

      - name: Download all packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: devserver-*
          merge-multiple: true
          path: packages/

      - name: Download SDK
        uses: actions/download-artifact@v4
        with:
          name: sdk-linux-x86_64
          path: packages/

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" packages/*.tar.gz --clobber
          else
            echo "No GitHub Release found for '$TAG' — skipping upload. Download artifacts from the Actions run page."
          fi
