name: Extension SDK Compatibility (Reusable)

# Reusable workflow that builds bundled extensions against the SDK built from a
# given ref and runs their MTR suites. Called by:
#   - extension-compat.yml (nightly workflow_run + manual workflow_dispatch)
#   - slash-commands.yml    (/testextensions on a PR)
#
# The SDK is compiled fresh from `ref` in build-server, and each extension is
# built against that SDK artifact — so passing a PR's head SHA as `ref` tests
# every extension against that exact commit.
#
# Extension test convention: each extension repo must have a mysql-test/
# directory at its root containing t/ and r/ subdirectories. This directory
# is mounted as mysql-test/suite/<extension-name>/ in the dev server package.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit/branch/tag to build the server and SDK from'
        required: true
        type: string
      platform_filter:
        description: 'Limit to one platform (linux-x86_64, linux-aarch64, macos-arm64)'
        required: false
        type: string
        default: ''
      extension_filter:
        description: 'Limit to one extension (e.g. vsql-ai)'
        required: false
        type: string
        default: ''
      abi_filter:
        description: 'Limit to one ABI (stable, dev); empty means per-extension declared'
        required: false
        type: string
        default: ''
    outputs:
      build-server-result:
        description: 'Aggregate result of the build-server matrix (success/failure/cancelled/skipped)'
        value: ${{ jobs.build-server.result }}

permissions:
  contents: read

jobs:
  # Builds one extension and runs its MTR suite against the dev server.
  # Matrix is the cross-product generated by prepare (platform x extension x abi).
  test-extension:
    name: Test ${{ matrix.extension }} (${{ matrix.platform }}, ${{ matrix.abi }} ABI)
    if: |
      needs.build-server.result != 'failure' &&
      needs.build-server.result != 'cancelled'
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download SDK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-${{ matrix.platform }}
          path: artifacts/

      - name: Extract and SDK
        run: |
          mkdir -p sdk
          tar xzf artifacts/villagesql-extension-sdk-*.tar.gz -C sdk
          echo "SDK_DIR=$(echo "$PWD"/sdk/villagesql-extension-sdk-*)" >> "$GITHUB_ENV"

      - name: Clone extension
        run: |
          # Self-hosted runners reuse the workspace; wipe any stale clone.
          rm -rf extension
          CLONE_ARGS=(--depth=1)
          [[ -n "${{ matrix.branch }}" ]] && CLONE_ARGS+=(--branch "${{ matrix.branch }}")
          git clone "${CLONE_ARGS[@]}" ${{ matrix.url }} extension/
          # C++ extensions are at the root.
          echo "EXT_ROOT=extension" >> "$GITHUB_ENV"

      - name: Build extension VEB
        id: build_ext
        run: |
          NCORES=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "4")
          DEV_ABI_FLAG=""
          [ "${{ matrix.abi }}" = "dev" ] && DEV_ABI_FLAG="-DVSQL_USE_DEV_ABI=ON"
          cmake -S "$EXT_ROOT"/ -B ext-build/ \
            -DVillageSQL_SDK_DIR="$SDK_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            $DEV_ABI_FLAG
          cmake --build ext-build/ --parallel "$NCORES"
          # Copy the built VEB into the dev server's extension directory
          find ext-build/ -maxdepth 1 -name "*.veb" \
            -exec cp {} "$PACKAGE_DIR/lib/veb/" \;
