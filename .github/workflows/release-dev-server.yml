name: Release Dev Server

# Triggered by version tags (e.g. 0.0.3, 0.0.3-dev) or manually.
# Builds the dev-server package for all three target platforms, runs the
# integration tests on each, then attaches the tarballs to an existing GitHub Release.
#
# Runner requirements:
#   - [self-hosted, linux, x86_64]    - existing CI runner
#   - linux on arm64 (GitHub-hosted)  - Apple Silicon
#   - macos-latest (GitHub-hosted)    - Apple Silicon
#
# The release build process builds binaries from several repositories.
# The main repository is villagesql-server and this repo is checked
# out into the top-level source tree.  The bundled extension are checked
# out into the exts top-level source tree.  The end results from the
# release build is placed into the build tree.
#
# <github.workspace>
# - source: clone of villagesql-server
# - build: cmake compilation sandbox
# - exts: sandbox for bundled extensions
#   - sources: clones of each bundled extension
#   - builds: sandboxes for extension builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag, branch, or SHA to build from (e.g. 0.0.4 or main).'
        required: true
      release_tag:
        description: 'GitHub Release to attach artifacts to. Defaults to "tag". Leave blank to skip upload (useful for test builds — artifacts are still available for download from the Actions run page).'
        required: false
        default: ''
      release_build:
        description: 'Release build: strip the -dev suffix from the version. Leave unchecked to include -dev (safe default).'
        required: false
        type: boolean
        default: false
      platform:
        description: 'Platform(s) to build. Use a single platform to speed up test runs.'
        required: false
        type: choice
        options:
          - all
          - linux-x86_64
          - linux-aarch64
          - macos-arm64
        default: all

permissions:
  contents: read

jobs:
  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          case "${{ inputs.platform }}" in
            linux-x86_64)
              M='{"include":[{"runner":["self-hosted","linux","x86_64"],"platform":"linux-x86_64","os":"linux"}]}'
              ;;
            linux-aarch64)
              M='{"include":[{"runner":"ubuntu-24.04-arm","platform":"linux-aarch64","os":"linux"}]}'
              ;;
            macos-arm64)
              M='{"include":[{"runner":"macos-latest","platform":"macos-arm64","os":"macos"}]}'
              ;;
            *)
              M='{"include":[{"runner":["self-hosted","linux","x86_64"],"platform":"linux-x86_64","os":"linux"},{"runner":"ubuntu-24.04-arm","platform":"linux-aarch64","os":"linux"},{"runner":"macos-latest","platform":"macos-arm64","os":"macos"}]}'
              ;;
          esac
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build-package:
    needs: compute-matrix
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-matrix.outputs.matrix) }}

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      OUTPUT_DIR: ${{ github.workspace }}/output
      EXTS_ROOT: ${{ github.workspace }}/exts
      BUILD_BUNDLED_EXTENSIONS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          path: source
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup VillageSQL build environment
        uses: ./source/.github/actions/setup-villagesql-build
        with:
          cache-boost: 'true'
          setup-ccache: 'false'

      - name: Checkout bundled extensions
        if: env.BUILD_BUNDLED_EXTENSIONS == '1'
        run: |
          mkdir -p "$EXTS_ROOT/sources"
          source/villagesql/bld_tools/checkout_bundled_extensions.sh \
            "$EXTS_ROOT/sources"

      # Bundled-extension build deps. Slated for separate revision; preserved
      # as inline steps so BUILD_BUNDLED_EXTENSIONS builds keep working.
      - name: Install bundled-extension dependencies (Linux)
        if: env.BUILD_BUNDLED_EXTENSIONS == '1' && matrix.os == 'linux'
        run: sudo source/scripts/setup_linux_ext_deps.sh

      - name: Install bundled-extension dependencies (macOS)
        if: env.BUILD_BUNDLED_EXTENSIONS == '1' && matrix.os == 'macos'
        run: source/scripts/setup_macos_ext_deps.sh

      - name: Build the dev server
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.release_build }}" == "true" ]]; then
            PRE_RELEASE=""
          else
            PRE_RELEASE="dev"
          fi
          echo "pre_release_version: '${PRE_RELEASE}'"

          EXTRA_FLAGS="-DDOWNLOAD_BOOST=1 -DWITH_BOOST=/tmp/boost -DVSQL_PRE_RELEASE_VERSION=${PRE_RELEASE}"
          if [ "${{ matrix.os }}" = "macos" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_SSL=$(brew --prefix openssl)"
          fi

          SOURCE_DIR="$SOURCE_DIR" \
          BUILD_DIR="$BUILD_DIR" \
          CMAKE_EXTRA_FLAGS="$EXTRA_FLAGS" \
          VSQL_PRE_RELEASE_VERSION="${PRE_RELEASE}" \
            source/villagesql/bld_tools/build_ci.sh

      - name: Build bundled extensions
        if: env.BUILD_BUNDLED_EXTENSIONS == '1'
        run: |
          SDK_STAGING_DIR="$(source/villagesql/bld_tools/get_sdk.sh "$BUILD_DIR")"
          source/villagesql/bld_tools/build_bundled_extensions.sh \
            "$EXTS_ROOT/sources" "${SDK_STAGING_DIR}" "${BUILD_DIR}/veb_output_directory"

      - name: Test bundled extensions
        if: env.BUILD_BUNDLED_EXTENSIONS == '1'
        run: |
          source/villagesql/bld_tools/test_extension_vebs.sh" \
            "$BUILD_DIR" \
            "$EXTS_ROOT/sources"

      - name: Package dev server tarball
        run: |
          mkdir -p "$OUTPUT_DIR"

          BUILD_DIR="$BUILD_DIR" \
          OUTPUT_DIR="$OUTPUT_DIR" \
          BUILD_BUNDLED_EXTENSIONS="${BUILD_BUNDLED_EXTENSIONS:-0}" \
            source/villagesql/bld_tools/package_dev_server.sh

      - name: Run integration tests
        run: |
          TARBALL=$(ls "$OUTPUT_DIR"/*.tar.gz | head -1)
          TEST_DIR=$(mktemp -d)
          tar xzf "$TARBALL" -C "$TEST_DIR"
          PACKAGE_DIR=$(echo "$TEST_DIR"/villagesql-dev-server-*)
          source/villagesql/dev_server/tests/integration_test.sh "$PACKAGE_DIR"
          rm -rf "$TEST_DIR"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devserver-${{ matrix.platform }}
          path: ${{ env.OUTPUT_DIR }}/*.tar.gz

      - name: Upload SDK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-${{ matrix.platform }}
          path: ${{ env.BUILD_DIR }}/villagesql-extension-sdk-*.tar.gz

  attach-release-artifacts:
    name: Attach Release Artifacts
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag || inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: devserver-*
          merge-multiple: true
          path: packages/

      - name: Download SDK
        uses: actions/download-artifact@v4
        with:
          name: sdk-linux-x86_64
          path: packages/

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" packages/*.tar.gz --clobber
          else
            echo "No GitHub Release found for '$TAG' — skipping upload. Download artifacts from the Actions run page."
          fi
