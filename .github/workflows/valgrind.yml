name: Valgrind Tests

# Build + test run under Valgrind memcheck, on Linux. Off one -DWITH_VALGRIND=1
# build it runs:
#   - the VillageSQL unit tests (via ctest -T memcheck), and
#   - the VillageSQL mysql-test suite (via --valgrind).
#
# WITH_VALGRIND=1 is what enables the MEM_MALLOCLIKE_BLOCK / MEM_UNDEFINED /
# MEM_NOACCESS client requests in include/memory_debugging.h and InnoDB's
# UNIV_DEBUG_VALGRIND paths, so memcheck sees MEM_ROOT and buffer-pool
# sub-allocations at the right granularity. That is why this needs its own
# build and cannot share the normal nightly one.
#
# Note on flags: this uses --valgrind (all executables), not
# --valgrind-mysqld. mysql-test-run.pl escalates to all-executables as soon as
# any --valgrind-option is given, and only that branch scales the start and
# suite timeouts that mysqld needs under memcheck.
#
# Trigger via:
#   - Actions tab -> Run workflow
#   - gh workflow run "Valgrind Tests"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to test'
        required: false
        default: ''
      test-suite:
        description: 'Test suite to run (e.g., villagesql/select, village, innodb)'
        required: false
        default: 'village'
      run-unit-tests:
        description: 'Run the VillageSQL unit tests under memcheck'
        required: false
        type: boolean
        default: true
      valgrind-options:
        description: 'Extra valgrind options, space separated (e.g. --show-reachable=no)'
        required: false
        default: ''
      max-parallel:
        description: 'Cap on mysql-test-run workers (each one runs mysqld and mysqltest under valgrind)'
        required: false
        default: '8'

jobs:
  valgrind-test:
    name: Build and Run Valgrind Tests
    runs-on: [self-hosted, linux, x86_64]
    permissions:
      contents: read

    env:
      SOURCE_DIR: ${{ github.workspace }}/source
      BUILD_DIR: ${{ github.workspace }}/build
      REQUEST_REF: ${{ inputs.ref }}
      # test_ci.sh passes --parallel=auto, which resolves to the runner's CPU
      # count. That is far too many valgrind'd servers to run at once: they
      # starve each other badly enough that shutdown_server exceeds its 60s
      # timeout and tests fail for reasons unrelated to what they check.
      # mysql-test-run caps 'auto' at MTR_MAX_PARALLEL.
      MTR_MAX_PARALLEL: ${{ inputs.max-parallel || '8' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        ref: ${{ env.REQUEST_REF }}
        fetch-depth: 50
        path: source

    - name: Setup VillageSQL build environment
      uses: ./source/.github/actions/setup-villagesql-build
      with:
        setup-ccache: 'false'

    - name: Build VillageSQL with Valgrind support
      working-directory: ./source
      run: ./villagesql/bld_tools/build_ci.sh
      env:
        BUILD_TYPE: debug
        CMAKE_EXTRA_FLAGS: -DWITH_VALGRIND=1

    # Each option is handed to mysql-test-run.pl as --valgrind-option=<opt> so
    # it reaches valgrind rather than being parsed as an MTR flag.
    - name: Compose extra valgrind options
      id: vg
      env:
        VG_OPTS: ${{ inputs.valgrind-options }}
      run: |
        EXTRA=""
        for opt in $VG_OPTS; do
          EXTRA="$EXTRA --valgrind-option=$opt"
        done
        echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"

    - name: Run Valgrind tests
      uses: ./source/.github/actions/run-tests
      with:
        run-unit-tests: ${{ inputs.run-unit-tests }}
        test-suite: ${{ inputs.test-suite }}
        valgrind: 'true'
        mysql-test-extra-flags: ${{ steps.vg.outputs.extra }}
        artifact-name: valgrind-logs-${{ github.run_number }}
