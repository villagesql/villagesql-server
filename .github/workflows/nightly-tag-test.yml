name: Post Nightly Tag Build and Test

on:
  push:
    tags:
      - 'nightly.*'  # Triggers on any tag starting with "nightly."
  workflow_dispatch:  # Allows manual triggering for testing
    inputs:
      tag:
        description: 'Tag to build and test'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Determine the tag to test
  get-tag:
    name: Get Tag
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
    - name: Determine tag to build
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

  # Run the full test suite
  run-tests:
    name: Release Build and Test
    needs: get-tag
    uses: ./.github/workflows/full-test-suite.yml
    with:
      ref: ${{ needs.get-tag.outputs.tag }}
      build-type: release
      artifact-prefix: nightly-tag-${{ needs.get-tag.outputs.tag }}
      run-all-suites-conditional: true
