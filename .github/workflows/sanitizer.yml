name: Sanitizer Tests (ASan+UBSan)

# Build + test run with AddressSanitizer and UndefinedBehaviorSanitizer
# enabled, on Linux. In a single job, off one sanitized server build, it runs:
#   - the VillageSQL unit tests (instrumented at compile time),
#   - the VillageSQL mysql-test suite (via --sanitize), and
#   - every bundled extension: each VEB is rebuilt with the same sanitizers and
#     its MTR suite is run under --sanitize. The extensions ship no C++ unit
#     tests, only MTR suites.
#
# Note: on Linux, LSan (LeakSanitizer) also runs, by default, under ASan.
#
# Unlike the shipping build, the extension steps pass include_unbundled=yes so
# all known extensions (vsql-vector and friends) get sanitized too.
#
# <github.workspace>
# - source: clone of villagesql-server
# - build:  cmake compilation sandbox (also holds veb_output_directory)
# - exts:
#   - sources: clones of each bundled extension
#
# Results are posted to Slack; see the notify job at the bottom.
#
# Trigger via: Actions tab -> Run workflow, or `gh workflow run sanitizer.yml`.
# nightly-dispatch.yml starts one run this way after every nightly build.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to test'
        required: false
        default: ''
      extension:
        description: 'Limit the extension phase to one extension (e.g. vsql-vector); empty for all'
        required: false
        default: ''
      slack_notify:
        description: 'Send Slack notification with results'
        required: false
        type: boolean
        default: false

concurrency:
  group: sanitizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Run Sanitizer Tests
    runs-on: [self-hosted, linux, x86_64]
    permissions:
      contents: read

    # Per-phase outcomes for the notify job. A phase that never ran (an earlier
    # non-continue-on-error step failed) reports as empty; notify renders that
    # as "did not run".
    outputs:
      sha: ${{ steps.checkout_report.outputs.sha }}
      build: ${{ steps.build.outcome }}
      unit: ${{ steps.unit.outcome }}
      mtr: ${{ steps.mtr.outcome }}
      ext_build: ${{ steps.ext_build.outcome }}
      ext_test: ${{ steps.ext_test.outcome }}

    env:
      SOURCE_DIR: ${{ github.workspace }}/source
      BUILD_DIR: ${{ github.workspace }}/build
      EXTS_ROOT: ${{ github.workspace }}/exts
      REQUEST_REF: ${{ inputs.ref || github.ref }}
      EXTENSION_FILTER: ${{ inputs.extension }}
      # MTR overwrites *SAN_OPTIONS for the server processes it spawns, so these
      # values govern the ctest unit tests (which inherit the job environment)
      # and make any sanitizer violation there fail the job rather than warn.
      ASAN_OPTIONS: abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
      # Server-side sanitizer selection. The extension builds below mirror it via
      # SAN_CFLAGS/SAN_LDFLAGS; repoint both to move to a different sanitizer.
      SERVER_SAN_FLAGS: -DWITH_ASAN=1 -DWITH_UBSAN=1
      # The extension links the sanitizer runtime already loaded by the
      # instrumented server, so no -shared-libasan.
      SAN_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      SAN_LDFLAGS: -fsanitize=address,undefined

    steps:
    - name: Report Parameters
      run: |
        echo "Requested ref: $REQUEST_REF"
        echo "Extension filter: ${EXTENSION_FILTER:-<all>}"
        echo "Source Directory: $SOURCE_DIR"
        echo "Build Directory:  $BUILD_DIR"
        echo "Extensions Root:  $EXTS_ROOT"
        echo "Server sanitizer flags: $SERVER_SAN_FLAGS"
        echo "Extension CFLAGS:  $SAN_CFLAGS"
        echo "Extension LDFLAGS: $SAN_LDFLAGS"
        echo "ASAN_OPTIONS:  $ASAN_OPTIONS"
        echo "UBSAN_OPTIONS: $UBSAN_OPTIONS"

    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        ref: ${{ env.REQUEST_REF }}
        fetch-depth: 50
        path: source

    - name: Report Checkout
      id: checkout_report
      run: |
        echo "Git SHA1: $(git -C source rev-parse HEAD)"
        echo "Git Commit: $(git -C source log -n1 --oneline)"
        echo "sha=$(git -C source rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Checkout bundled extensions
      run: |
        # Self-hosted runners reuse the workspace; wipe stale extension clones
        rm -rf "$EXTS_ROOT"
        mkdir -p "$EXTS_ROOT/sources"

        source/villagesql/bld_tools/checkout_bundled_extensions.sh \
          "$EXTS_ROOT/sources" "$EXTENSION_FILTER" yes

    - name: Setup VillageSQL build environment
      uses: ./source/.github/actions/setup-villagesql-build
      with:
        # Skip the GitHub Actions ccache: it shares a repo-wide 10 GB quota
        # (LRU-evicted) with the regular/nightly build caches, so a periodic
        # sanitizer build would evict them and slow normal builds. Matches
        # valgrind.yml / full-test-suite.yml.
        setup-ccache: 'false'

    - name: Install bundled-extension dependencies
      run: sudo source/scripts/setup_linux_ext_deps.sh

    - name: Build VillageSQL with ASan+UBSan
      id: build
      # build_ci.sh also builds the villagesql-unit-tests target, so the unit
      # tests are compiled with the sanitizers too.
      env:
        BUILD_TYPE: debug
        CMAKE_EXTRA_FLAGS: ${{ env.SERVER_SAN_FLAGS }}
      run: source/villagesql/bld_tools/build_ci.sh

    # Run each test suite separately so they all run (versus stop at first failure).
    - name: Run VillageSQL unit tests (sanitizers)
      id: unit
      continue-on-error: true
      uses: ./source/.github/actions/run-tests
      with:
        run-integration-tests: false
        artifact-name: sanitizer-unit-logs-${{ github.run_number }}

    - name: Run VillageSQL mtr suite (sanitizers)
      id: mtr
      continue-on-error: true
      uses: ./source/.github/actions/run-tests
      with:
        run-unit-tests: false
        mysql-test-extra-flags: --sanitize
        artifact-name: sanitizer-mtr-logs-${{ github.run_number }}

    # Each VEB is built with the same sanitizers against the sanitized SDK from
    # the build above.
    - name: Build bundled extensions (sanitizers)
      id: ext_build
      continue-on-error: true
      env:
        CMAKE_EXTRA_FLAGS: -DCMAKE_BUILD_TYPE=Debug
        CFLAGS: ${{ env.SAN_CFLAGS }}
        CXXFLAGS: ${{ env.SAN_CFLAGS }}
        LDFLAGS: ${{ env.SAN_LDFLAGS }}
      run: |
        SDK_STAGING_DIR="$(source/villagesql/bld_tools/get_sdk.sh "$BUILD_DIR")"
        source/villagesql/bld_tools/build_bundled_extensions.sh \
          "$EXTS_ROOT/sources" "$SDK_STAGING_DIR" \
          "$BUILD_DIR/veb_output_directory" "$EXTENSION_FILTER" yes

    # MTR auto-copies *.veb from <bindir>/veb_output_directory into each test
    # server, so the VEBs built above are picked up with no extra plumbing.
    - name: Test bundled extensions (sanitizers)
      id: ext_test
      continue-on-error: true
      # Runs even if some extension failed to build, so the ones that did build
      # still get exercised; the build failure fails the job on its own.
      if: always()
      env:
        MTR_EXTRA_FLAGS: --sanitize
      run: |
        source/villagesql/bld_tools/test_extension_vebs.sh \
          "$BUILD_DIR" "$EXTS_ROOT/sources"

    - name: Upload extension MTR logs on failure
      if: always() && steps.ext_test.outcome != 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sanitizer-ext-mtr-logs-${{ github.run_number }}
        # test_extension_vebs.sh with MTR_BINDIR=$BUILD_DIR puts output into
        # $BUILD_DIR/mysql-test/var (not the source # tree). Under --parallel
        # each worker writes its mysqld.N.err to var/<N>/log/.
        path: |
          ${{ env.BUILD_DIR }}/mysql-test/var/log/
          ${{ env.BUILD_DIR }}/mysql-test/var/*/log/
        if-no-files-found: warn
        retention-days: 7

    - name: Fail if any sanitizer phase failed
      if: always()
      run: |
        echo "Unit tests:      ${{ steps.unit.outcome }}"
        echo "MTR suite:       ${{ steps.mtr.outcome }}"
        echo "Extension build: ${{ steps.ext_build.outcome }}"
        echo "Extension tests: ${{ steps.ext_test.outcome }}"
        if [ "${{ steps.unit.outcome }}" != "success" ] || \
           [ "${{ steps.mtr.outcome }}" != "success" ] || \
           [ "${{ steps.ext_build.outcome }}" != "success" ] || \
           [ "${{ steps.ext_test.outcome }}" != "success" ]; then
          echo "::error::One or more sanitizer test phases failed; see the step logs and uploaded artifacts."
          exit 1
        fi
        echo "All sanitizer test phases passed."

  # Posts a per-phase summary after the run.
  notify:
    name: Slack Notification
    needs: build-and-test
    # Even if build-and-test fails, but only if slack notify requested.
    if: always() && inputs.slack_notify
    runs-on: ubuntu-latest
    # Posts to a webhook; needs no repo access.
    permissions: {}
    steps:
      - name: Build phase summary
        id: summary
        env:
          BUILD: ${{ needs.build-and-test.outputs.build }}
          UNIT: ${{ needs.build-and-test.outputs.unit }}
          MTR: ${{ needs.build-and-test.outputs.mtr }}
          EXT_BUILD: ${{ needs.build-and-test.outputs.ext_build }}
          EXT_TEST: ${{ needs.build-and-test.outputs.ext_test }}
        run: |
          line() {
            local label="$1" outcome="$2" icon
            case "$outcome" in
              success) icon="✅" ;;
              failure) icon="❌" ;;
              "")      icon="⏭️"; outcome="did not run" ;;
              *)       icon="⚠️" ;;
            esac
            printf '%s %s: %s\n' "$icon" "$label" "$outcome"
          }
          SUMMARY=$(
            line "Server build"    "$BUILD"
            line "Unit tests"      "$UNIT"
            line "MTR suite"       "$MTR"
            line "Extension build" "$EXT_BUILD"
            line "Extension tests" "$EXT_TEST"
          )
          echo "$SUMMARY"
          # jq -Rs emits a JSON string (newlines escaped), so it stays one line
          # in GITHUB_OUTPUT and drops into the payload below unquoted.
          echo "text=$(jq -Rs . <<<"$SUMMARY")" >> "$GITHUB_OUTPUT"

      - name: Compute overall status
        id: status
        env:
          RESULT: ${{ needs.build-and-test.result }}
        run: |
          case "$RESULT" in
            success)   label=passed;    emoji="✅"; color="#36a64f" ;;
            cancelled) label=cancelled; emoji="⚠️"; color="#daa520" ;;
            *)         label=failed;    emoji="❌"; color="#cc0000" ;;
          esac
          {
            echo "label=$label"
            echo "emoji=$emoji"
            echo "color=$color"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} Sanitizer Tests (ASan+UBSan) ${{ steps.status.outputs.label }}",
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "text":  ${{ steps.summary.outputs.text }},
                  "fields": [
                    {
                      "title": "Run",
                      "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View details>",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "${{ needs.build-and-test.outputs.sha || 'unknown' }}",
                      "short": true
                    },
                    {
                      "title": "Triggered by",
                      "value": "${{ github.event_name }}",
                      "short": true
                    }
                  ]
                }
              ]
            }
