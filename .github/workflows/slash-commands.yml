name: Slash Commands

# Single front door for slash-commands posted as PR comments. Parses the
# command, resolves the PR head SHA, reacts, refuses duplicate runs, and routes
# to a reusable workflow.
#
# NOTE: issue_comment workflows always run from the DEFAULT BRANCH version of
# this file. Changes here only take effect once merged to main; a /command on a
# PR runs the dispatcher as it exists on main, not on the PR branch.
#
# To add a command:
#   1. Ensure a reusable workflow exists (uses: ./.github/workflows/<x>.yml).
#   2. Add it to COMMANDS in the parse step (for validation + /help).
#   3. Add a `run-<command>` caller job below, gated on the command name.

on:
  issue_comment:
    types: [created]

# run-name embeds the PR number so the parse job's already-running check can
# associate in-flight runs with a PR (issue_comment runs all report the default
# branch, so branch filtering is not usable).
run-name: "PR #${{ github.event.issue.number }}: ${{ github.event.comment.body }}"

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  parse:
    name: Parse command
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request
    outputs:
      command: ${{ steps.parse.outputs.command }}
      ref: ${{ steps.parse.outputs.ref }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
      should_run: ${{ steps.parse.outputs.should_run }}
    steps:
      - name: Parse and validate
        id: parse
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // Registry of supported commands. Add new commands here and add a
            // matching run-<command> caller job below.
            const COMMANDS = ['testall', 'testextensions'];

            const { owner, repo } = context.repo;
            const prNumber = context.issue.number;
            const body = (context.payload.comment.body || '').trim();
            const firstTok = body.split(/\s+/)[0] || '';

            // Ignore comments that aren't slash-commands at all (no noise).
            if (!firstTok.startsWith('/')) {
              core.setOutput('should_run', 'false');
              return;
            }
            const name = firstTok.slice(1).toLowerCase();

            const helpText = () =>
              `**Slash commands**\n\n` +
              COMMANDS.map(c => `- \`/${c}\``).join('\n') +
              `\n- \`/help\``;

            const comment = (b) => github.rest.issues.createComment(
              { owner, repo, issue_number: prNumber, body: b });

            if (name === 'help' || name === 'commands') {
              await comment(helpText());
              core.setOutput('should_run', 'false');
              return;
            }
            if (!COMMANDS.includes(name)) {
              await comment(`Unknown command \`/${name}\`.\n\n` + helpText());
              core.setOutput('should_run', 'false');
              return;
            }

            // Restrict who can kick off (self-hosted) CI to people with repo
            // access — mirrors the org-member exemption in cla.yml. MEMBER means
            // a member of the org that owns the repo.
            const ALLOWED = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const assoc = context.payload.comment.author_association;
            if (!ALLOWED.includes(assoc)) {
              await comment(
                `🔒 \`/${name}\` is restricted to organization members. ` +
                `(Your association: \`${assoc}\`.)`);
              core.setOutput('should_run', 'false');
              return;
            }

            // Best-effort duplicate guard: if a previous Slash Commands run for
            // THIS PR is still in flight, point at it and don't start another.
            // (Can't cancel/queue with a "notify" message via native
            // concurrency, so we check the API. Matched by run-name prefix.)
            const prefix = `PR #${prNumber}:`;
            for (const status of ['in_progress', 'queued']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'slash-commands.yml',
                status, per_page: 50,
              });
              const other = data.workflow_runs.find(r =>
                r.id !== context.runId &&
                (r.display_title || r.name || '').startsWith(prefix));
              if (other) {
                await comment(
                  `⏳ A Slash Commands run is already in progress for this PR: ` +
                  `[run #${other.run_number}](${other.html_url}). ` +
                  `Waiting for it to finish — re-comment once it completes.`);
                core.setOutput('should_run', 'false');
                return;
              }
            }

            const { data: pr } = await github.rest.pulls.get(
              { owner, repo, pull_number: prNumber });

            // Acknowledge receipt (best-effort).
            try {
              await github.rest.reactions.createForIssueComment({
                owner, repo, comment_id: context.payload.comment.id,
                content: 'rocket',
              });
            } catch (e) {
              core.info(`Could not add reaction: ${e.message}`);
            }

            core.setOutput('command', name);
            core.setOutput('ref', pr.head.sha);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('should_run', 'true');
            core.info(`/${name} on PR #${prNumber}: testing ${pr.head.sha}`);

  run-testall:
    needs: parse
    if: needs.parse.outputs.should_run == 'true' && needs.parse.outputs.command == 'testall'
    uses: ./.github/workflows/full-test-suite.yml
    with:
      ref: ${{ needs.parse.outputs.ref }}
      pr_number: ${{ needs.parse.outputs.pr_number }}
      build-type: debug
      artifact-prefix: testall
      run-all-suites-conditional: false
    secrets: inherit

  run-testextensions:
    needs: parse
    if: needs.parse.outputs.should_run == 'true' && needs.parse.outputs.command == 'testextensions'
    uses: ./.github/workflows/extension-compat-suite.yml
    with:
      ref: ${{ needs.parse.outputs.ref }}
      pr_number: ${{ needs.parse.outputs.pr_number }}
      platform_filter: linux-x86_64
      # abi_filter omitted => both ABIs, per-extension declared
      slack_notify: 'false'
    secrets: inherit
