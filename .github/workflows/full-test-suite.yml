name: Full Test Suite

# Workflow to run the full test suite

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout and test (default main)'
        required: false
        type: string
        default: 'main'
      build-type:
        description: 'Build type (debug or release)'
        required: false
        type: string
        default: 'debug'
      artifact-prefix:
        description: 'Prefix for artifact names'
        required: false
        type: string
        default: 'full-test'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to checkout and test (default main)'
        required: false
        type: string
        default: 'main'
      build-type:
        description: 'Build type (debug or release)'
        required: false
        type: string
        default: 'debug'
      artifact-prefix:
        description: 'Prefix for artifact names'
        required: false
        type: string
        default: 'full-test'

jobs:
  build-and-test:
    name: Build and Run All Tests
    runs-on: self-hosted
    permissions:
      contents: read

    env:
      SOURCE_DIR: ${{ github.workspace }}/source
      BUILD_DIR: ${{ github.workspace }}/build

    steps:
    - name: Report Parameters
      run: |
        echo "Git Rev: ${{ inputs.ref }}"
        echo "Build type: ${{ inputs.build-type }}"
        echo "Artifact prefix: ${{ inputs.artifact-prefix }}"

    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 50
        path: source

    - name: Report Checkout
      run: |
        echo "Git SHA1: $(git -C source rev-parse ${{ inputs.ref }})"
        echo "Git Commit: $(git -C source log -n1 --oneline)"

    - name: Setup VillageSQL build environment
      uses: ./source/.github/actions/setup-villagesql-build
      with:
        setup-ccache: 'false'

    - name: Build VillageSQL
      working-directory: ./source
      run: |
        ./villagesql/bld_tools/build_ci.sh

        # Include the extra tests
        cd "$BUILD_DIR"
        make "-j$PARALLEL_JOBS" abi_v1_check-t abi_v2_check-t \
          custom_indexes-t semver-t type_descriptor-t type_builder-t \
          type_context-t validate-t victionary_client-t

      env:
        PARALLEL_JOBS: 16
        BUILD_TYPE: ${{ inputs.build-type }}

    - name: Run standard tests (unit, integration with only suite village)
      uses: ./source/.github/actions/run-tests
      with:
        artifact-name: ${{ inputs.artifact-prefix }}-logs-${{ github.run_number }}

    - name: Run big tests
      uses: ./source/.github/actions/run-tests
      with:
        run-unit-tests: false
        run-big-tests: true
        artifact-name: ${{ inputs.artifact-prefix }}-big-test-logs-${{ github.run_number }}

    - name: Run all test suites (excluding VillageSQL)
      uses: ./source/.github/actions/run-tests
      with:
        run-unit-tests: false
        run-all-suites: true
        skip-suite: village
        artifact-name: ${{ inputs.artifact-prefix }}-all-suites-logs-${{ github.run_number }}
