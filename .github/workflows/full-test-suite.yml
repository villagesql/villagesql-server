name: Full Test Suite (Reusable)

# Reusable workflow for running the full test suite
# Called by testall.yml and nightly-tag-test.yml

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout and test'
        required: true
        type: string
      build-type:
        description: 'Build type (debug or release)'
        required: false
        type: string
        default: 'debug'
      artifact-prefix:
        description: 'Prefix for artifact names'
        required: false
        type: string
        default: 'full-test'
      run-all-suites-conditional:
        description: 'Check should_run_all_tests.sh before running all suites'
        required: false
        type: boolean
        default: false
      pr_number:
        description: 'If set, post a pass/fail summary as a comment on this PR'
        required: false
        type: string
        default: ''

jobs:
  build-and-test:
    name: Build and Run All Tests
    runs-on: self-hosted
    permissions:
      contents: read

    env:
      SOURCE_DIR: ${{ github.workspace }}/source
      BUILD_DIR: ${{ github.workspace }}/build

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 50
        path: source

    - name: Setup VillageSQL build environment
      uses: ./source/.github/actions/setup-villagesql-build
      with:
        setup-ccache: 'false'

    - name: Build VillageSQL
      working-directory: ./source
      run: ./scripts/build-ci.sh
      env:
        PARALLEL_JOBS: 16
        BUILD_TYPE: ${{ inputs.build-type }}


    - name: Run tests
      uses: ./source/.github/actions/run-tests
      with:
        artifact-name: ${{ inputs.artifact-prefix }}-logs-${{ github.run_number }}

    - name: Run big tests
      uses: ./source/.github/actions/run-tests
      with:
        run-unit-tests: false
        run-big-tests: true
        artifact-name: ${{ inputs.artifact-prefix }}-big-test-logs-${{ github.run_number }}

    - name: Check if should run all tests
      if: inputs.run-all-suites-conditional
      id: check-all-tests
      working-directory: ./source
      run: |
        if ./scripts/should_run_all_tests.sh; then
          echo "run=true" >> $GITHUB_OUTPUT
        else
          echo "run=false" >> $GITHUB_OUTPUT
          echo "Skipping all test suites - commit unchanged from previous nightly"
        fi

    - name: Run all test suites (excluding VillageSQL)
      if: >
        !inputs.run-all-suites-conditional ||
        steps.check-all-tests.outputs.run == 'true'
      uses: ./source/.github/actions/run-tests
      with:
        run-unit-tests: false
        run-all-suites: true
        skip-suite: village
        artifact-name: ${{ inputs.artifact-prefix }}-all-suites-logs-${{ github.run_number }}

  # Posts a pass/fail summary as a PR comment when the run finishes. Only when
  # pr_number is set (i.e. invoked by /testall). This is the companion to the
  # "started" comment posted by slash-commands.yml.
  report:
    name: Report result
    needs: build-and-test
    if: always() && inputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - name: Post or update comment
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          const prNumber = Number('${{ inputs.pr_number }}');
          const result = '${{ needs.build-and-test.result }}';
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const icon = result === 'success' ? '✅'
            : result === 'cancelled' ? '⚠️' : '❌';

          const body = `## ${icon} \`/testall\` ${result}\n\n`
            + `Full test suite (unit + big + all suites) finished with result `
            + `\`${result}\`.\n\n[View run](${runUrl})`;

          const { owner, repo } = context.repo;
          await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
