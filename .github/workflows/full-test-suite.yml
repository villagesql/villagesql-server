name: Full Test Suite

# Workflow to run the full test suite.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout and test (default main)'
        required: false
        type: string
        default: 'main'
      build-type:
        description: 'Build type (debug or release)'
        required: false
        type: string
        default: 'debug'
      artifact-prefix:
        description: 'Prefix for artifact names'
        required: false
        type: string
        default: 'full-test'
      platform:
        description: 'Platform to build and test on, per json_platforms.sh'
        required: false
        type: string
        default: 'linux-x86_64'
      slack_notify:
        description: 'Send Slack notification with results'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to checkout and test (default main)'
        required: false
        type: string
        default: 'main'
      build-type:
        description: 'Build type (debug or release)'
        required: false
        type: string
        default: 'debug'
      artifact-prefix:
        description: 'Prefix for artifact names'
        required: false
        type: string
        default: 'full-test'
      platform:
        description: 'Platform to build and test on'
        required: false
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - macos-arm64
        default: linux-x86_64
      slack_notify:
        description: 'Send Slack notification with results'
        required: false
        type: boolean
        default: false

jobs:
  # Turn the platform name into a runs-on value.
  resolve-platform:
    name: Resolve Platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.platform.outputs.runner }}

    steps:
    - name: Checkout platform registry
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 1
        sparse-checkout: villagesql/bld_matrix/

    - name: Resolve platform
      id: platform
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail

        # The registry is shared with the other multi-platform workflows, and
        # is runnable locally:
        #   villagesql/bld_matrix/json_platforms.sh | jq .
        PLATFORMS="$(villagesql/bld_matrix/json_platforms.sh)"

        ENTRY="$(jq -c --arg p "$PLATFORM" \
          '.[] | select(.platform == $p)' <<<"$PLATFORMS")"
        if [ -z "$ENTRY" ]; then
          KNOWN="$(jq -r '[.[].platform] | join(", ")' <<<"$PLATFORMS")"
          echo "::error::Unknown platform '$PLATFORM'. Known platforms: $KNOWN"
          exit 1
        fi
        jq . <<<"$ENTRY"

        # `runner` stays JSON: it is a label array for self-hosted runners and
        # a plain string for GitHub-hosted ones, and the consumer fromJSON's it.
        echo "runner=$(jq -c '.runner' <<<"$ENTRY")" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and Run All Tests (${{ inputs.platform }})
    needs: resolve-platform
    runs-on: ${{ fromJSON(needs.resolve-platform.outputs.runner) }}
    permissions:
      contents: read

    # Stage outcomes for the notify job. A stage that never ran reports as
    # an empty string.
    outputs:
      checkout: ${{ steps.checkout.outcome }}
      build: ${{ steps.build.outcome }}
      standard_tests: ${{ steps.standard_tests.outcome }}
      big_tests: ${{ steps.big_tests.outcome }}
      all_suites: ${{ steps.all_suites.outcome }}
      commit: ${{ steps.checkout.outputs.commit }}

    env:
      SOURCE_DIR: ${{ github.workspace }}/source
      BUILD_DIR: ${{ github.workspace }}/build
      REF: ${{ inputs.ref }}
      BUILD_TYPE: ${{ inputs.build-type }}
      ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}

    steps:
    - name: Report Parameters
      run: |
        echo "Trigger: $GITHUB_EVENT_NAME"
        echo "Git Rev: $REF"
        echo "Build type: $BUILD_TYPE"
        echo "Platform: ${{ inputs.platform }}"
        echo "Artifact prefix: $ARTIFACT_PREFIX"

    - name: Checkout code
      id: checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        ref: ${{ env.REF }}
        fetch-depth: 50
        path: source

    - name: Report Checkout
      run: |
        echo "Git SHA1: $(git -C source rev-parse ${{ env.REF }})"
        echo "Git Commit: $(git -C source log -n1 --oneline)"

    # Ahead of "Record run parameters" because that step needs jq, and on macOS
    # this is what installs it.
    - name: Setup VillageSQL build environment
      uses: ./source/.github/actions/setup-villagesql-build
      with:
        setup-ccache: 'false'

    - name: Record run parameters
      run: |
        source "$SOURCE_DIR/villagesql/scripts/vsql_script_utils.sh"
        source "$SOURCE_DIR/villagesql/bld_tools/build_info.sh"
        VSQL_VERSION=$(vsql_json_version "$SOURCE_DIR")
        VSQL_CODEBASE=$(vsql_json_codebase "$SOURCE_DIR")

        vsql_platform_info
        BUILD_TARGET="${VSQL_CODEBASE}_${VSQL_VERSION}-${PLATFORM}-${ARCH}"

        jq -n \
          --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg trigger "$GITHUB_EVENT_NAME" \
          --arg gitRev "$REF" \
          --arg buildType "$BUILD_TYPE" \
          --arg codebase "$VSQL_CODEBASE" \
          --arg version "$VSQL_VERSION" \
          --arg os "$PLATFORM" \
          --arg arch "$ARCH" \
          --arg buildTarget "$BUILD_TARGET" \
          --arg artifactPrefix "$ARTIFACT_PREFIX" \
          --arg sha "$(git -C source rev-parse HEAD)" \
          --arg commitSubject "$(git -C source log -n1 --format=%s)" \
          '$ARGS.named' > run-parameters.json
        # Pretty print as output
        jq . run-parameters.json

    - name: Upload run parameters
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: run-parameters
        path: run-parameters.json
        if-no-files-found: warn
        retention-days: 7

    - name: Build VillageSQL
      id: build
      working-directory: ./source
      run: "$SOURCE_DIR/villagesql/bld_tools/build_server.sh"

    - name: Run standard tests (unit, integration with only suite village)
      id: standard_tests
      uses: ./source/.github/actions/run-tests
      with:
        artifact-name: ${{ env.ARTIFACT_PREFIX }}-logs-${{ github.run_number }}

    - name: Run big tests
      id: big_tests
      uses: ./source/.github/actions/run-tests
      with:
        run-unit-tests: false
        run-big-tests: true
        artifact-name: ${{ env.ARTIFACT_PREFIX }}-big-test-logs-${{ github.run_number }}

    - name: Run all test suites (excluding VillageSQL)
      id: all_suites
      uses: ./source/.github/actions/run-tests
      with:
        run-unit-tests: false
        run-all-suites: true
        skip-suite: village
        artifact-name: ${{ env.ARTIFACT_PREFIX }}-all-suites-logs-${{ github.run_number }}

    # Each test stage overwrites the MTR report, and the ladder stops at the
    # first failure, so this is the report of the stage that failed.
    - name: Upload MTR report for Slack
      if: always() && inputs.slack_notify
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fts-slack-mtr-report
        path: ${{ env.BUILD_DIR }}/mysql-test-report.xml
        if-no-files-found: ignore
        retention-days: 1

  # A separate job, so a failed checkout of `ref` is still reported: the report
  # script comes from this workflow's own revision.
  notify:
    name: Slack Notification
    needs: [resolve-platform, build-and-test]
    if: always() && inputs.slack_notify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout report scripts
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 1
        sparse-checkout: |
          villagesql/bld_tools/
          villagesql/scripts/

    - name: Download MTR report
      # Absent when no test stage ran; the script reports that case.
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: fts-slack-mtr-report
        path: report/

    - name: Prepare report
      env:
        STATUS: ${{ needs.build-and-test.result }}
        PLATFORM: ${{ inputs.platform }}
        BUILD_TYPE: ${{ inputs.build-type }}
        CHECKOUT: ${{ needs.build-and-test.outputs.checkout }}
        BUILD: ${{ needs.build-and-test.outputs.build }}
        STANDARD_TESTS: ${{ needs.build-and-test.outputs.standard_tests }}
        BIG_TESTS: ${{ needs.build-and-test.outputs.big_tests }}
        ALL_SUITES: ${{ needs.build-and-test.outputs.all_suites }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BRANCH: ${{ inputs.ref }}
        COMMIT: ${{ needs.build-and-test.outputs.commit }}
        TRIGGER: ${{ github.event_name }}
      run: |
        if ! command -v xmllint >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y libxml2-utils
        fi

        villagesql/bld_tools/prepare_fts_report.sh \
          --status "$STATUS" \
          --platform "$PLATFORM" \
          --build-type "$BUILD_TYPE" \
          --stage "Checkout code=$CHECKOUT" \
          --stage "Build VillageSQL=$BUILD" \
          --test-stage "Run standard tests=$STANDARD_TESTS" \
          --test-stage "Run big tests=$BIG_TESTS" \
          --test-stage "Run all test suites (not vsql)=$ALL_SUITES" \
          --xml report/mysql-test-report.xml \
          --run-url "$RUN_URL" \
          --branch "$BRANCH" \
          --commit "$COMMIT" \
          --trigger "$TRIGGER" \
          > fts-report.json
        jq . fts-report.json

    - name: Send Slack notification
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload-file-path: fts-report.json
