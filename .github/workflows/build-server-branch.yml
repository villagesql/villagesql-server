name: Build Server Branch

# Builds the dev-server package for a SINGLE target, runs the integration
# tests, and uploads the package + SDK as run-scoped artifacts.
#
# The bare minimum is to build the server, package it as a tarball, and upload
# that artifact.  Everything else is optional, and enabled by default.
#
# The server will be uploaded with the artifact name
# devserver-${{ inputs.platform }}. The SDK (optional) will be uploaded with
# the artifact name sdk-${{ inputs.platform }}.
#
# <github.workspace>
# - source: clone of villagesql-server
# - build:  cmake compilation sandbox
# - exts:   sandbox for bundled extensions
#   - sources: clones of each bundled extension
#   - builds:  sandboxes for extension builds

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git tag, branch, or SHA to build from.'
        required: true
        type: string
      platform:
        description: 'Platform label used to name the devserver artifact (e.g. linux-x86_64).'
        required: true
        type: string
      release_build:
        description: 'Strip the -dev suffix from the version.'
        required: true
        type: boolean
      os:
        description: 'Build OS family: linux or macos.'
        required: true
        type: string
      runner:
        description: 'JSON-encoded runs-on value (array or quoted string), e.g. ["self-hosted","linux","x86_64"] or "macos-latest".'
        required: true
        type: string
      bundled_extensions:
        description: 'Build (and test) the bundled extensions. Callers that build extensions separately (e.g. extension-compat-suite) pass false.'
        required: false
        type: boolean
        default: true
      run_unit_tests:
        description: 'Run the server unit/MTR tests after building.'
        required: false
        type: boolean
        default: true
      run_integration_tests:
        description: 'Run the packaged dev-server integration test after building.'
        required: false
        type: boolean
        default: true
      upload_sdk:
        description: 'Upload the built extension SDK as a run-scoped artifact.'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag, branch, or SHA to build from (e.g. 0.0.4 or main).'
        required: true
        type: string
      platform:
        description: 'Platform label used to name the server artifact.'
        required: false
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - macos-arm64
        default: linux-x86_64
      release_build:
        description: 'Release build: strip the -dev suffix from the version. Leave unchecked to include -dev (safe default).'
        required: false
        type: boolean
        default: false
      os:
        description: 'Build OS family.'
        required: true
        type: choice
        options:
          - linux
          - macos
        default: linux
      runner:
        description: 'JSON-encoded runs-on value, e.g. ["self-hosted","linux","x86_64"] or "macos-latest".'
        required: true
        type: string
        default: '["self-hosted","linux","x86_64"]'
      bundled_extensions:
        description: 'Build (and test) the bundled extensions.'
        required: false
        type: boolean
        default: true
      run_unit_tests:
        description: 'Run the server unit/MTR tests after building.'
        required: false
        type: boolean
        default: true
      run_integration_tests:
        description: 'Run the packaged dev-server integration test after building.'
        required: false
        type: boolean
        default: true
      upload_sdk:
        description: 'Upload the built extension SDK as a run-scoped artifact.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:

  build-package:
    name: Build (${{ inputs.platform }})
    runs-on: ${{ fromJSON(inputs.runner) }}

    env:
      SOURCE_DIR: ${{ github.workspace }}/source
      BUILD_DIR: ${{ github.workspace }}/build
      OUTPUT_DIR: ${{ github.workspace }}/output
      EXTS_ROOT: ${{ github.workspace }}/exts
      RUN_UNIT_TESTS: ${{ inputs.run_unit_tests && '1' || '0' }}
      RUN_INTEGRATION_TESTS: ${{ inputs.run_integration_tests && '1' || '0' }}
      BUILD_BUNDLED_EXTENSIONS: ${{ inputs.bundled_extensions && '1' || '0' }}
      UPLOAD_SDK: ${{ inputs.upload_sdk && '1' || '0' }}
      # SPOOKY ACTION AT A DISTANCE: Resolve the release/-dev decision once, at
      # job scope, so every step sees the same value. Scripts that re-derive the
      # version from VSQL_VERSION (get_sdk.sh, package_dev_server.sh) key off
      # this env var; leave it unset and they fall back to VSQL_VERSION file's
      # 'dev' suffix regardless of release_build.
      VSQL_PRE_RELEASE_VERSION: ${{ !inputs.release_build && 'dev' || '' }}

    steps:
      - name: Report Parameters
        run: |
          echo "Git Rev: ${{ inputs.ref }}"
          echo "Platform: ${{ inputs.platform }}"
          echo "Release Bld: ${{ inputs.release_build }}"
          echo "OS: ${{ inputs.os }}"
          echo "Runner: ${{ inputs.runner }}"
          echo "Run Unit Tests: $RUN_UNIT_TESTS (${{ inputs.run_unit_tests }})"
          echo "Run Integration Tests: $RUN_INTEGRATION_TESTS (${{ inputs.run_integration_tests }})"
          echo "Bundle Extension: $BUILD_BUNDLED_EXTENSIONS (${{ inputs.bundled_extensions }})"
          echo "Upload SDK: $UPLOAD_SDK (${{ inputs.upload_sdk }})"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          path: source
          ref: ${{ inputs.ref }}

      - name: Report Checkout
        run: |
          echo "Git SHA1: $(git -C source rev-parse ${{ inputs.ref }})"
          echo "Git Commit: $(git -C source log -n1 --oneline)"

      - name: Setup VillageSQL build environment
        uses: ./source/.github/actions/setup-villagesql-build
        with:
          cache-boost: 'true'
          setup-ccache: 'false'

      - name: Checkout bundled extensions
        if: env.BUILD_BUNDLED_EXTENSIONS == '1'
        run: |
          # Self-hosted runners reuse the workspace; wipe stale extension clones
          rm -rf "$EXTS_ROOT"
          mkdir -p "$EXTS_ROOT/sources"
          source/villagesql/bld_tools/checkout_bundled_extensions.sh \
            "$EXTS_ROOT/sources"

      # Bundled-extension build deps. Slated for separate revision; preserved
      # as inline steps so BUILD_BUNDLED_EXTENSIONS builds keep working.
      - name: Install bundled-extension dependencies (Linux)
        if: env.BUILD_BUNDLED_EXTENSIONS == '1' && inputs.os == 'linux'
        run: sudo source/scripts/setup_linux_ext_deps.sh

      - name: Install bundled-extension dependencies (macOS)
        if: env.BUILD_BUNDLED_EXTENSIONS == '1' && inputs.os == 'macos'
        run: source/scripts/setup_macos_ext_deps.sh

      - name: Build the dev server
        run: |
          EXTRA_FLAGS="-DDOWNLOAD_BOOST=1 -DWITH_BOOST=/tmp/boost -DVSQL_PRE_RELEASE_VERSION=${VSQL_PRE_RELEASE_VERSION}"
          if [ "${{ inputs.os }}" = "macos" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_SSL=$(brew --prefix openssl)"
          fi

          SOURCE_DIR="$SOURCE_DIR" \
          BUILD_DIR="$BUILD_DIR" \
          CMAKE_EXTRA_FLAGS="$EXTRA_FLAGS" \
            source/villagesql/bld_tools/build_ci.sh

      - name: Run unit tests
        if: env.RUN_UNIT_TESTS == '1'
        uses: ./source/.github/actions/run-tests
        with:
          run-unit-tests: 'true'
          run-integration-tests: 'false'
          artifact-name: unit-tests

      - name: Build bundled extensions
        if: env.BUILD_BUNDLED_EXTENSIONS == '1'
        run: |
          SDK_STAGING_DIR="$(source/villagesql/bld_tools/get_sdk.sh "$BUILD_DIR")"
          source/villagesql/bld_tools/build_bundled_extensions.sh \
            "$EXTS_ROOT/sources" "${SDK_STAGING_DIR}" "${BUILD_DIR}/veb_output_directory"

      - name: Test bundled extensions
        if: env.BUILD_BUNDLED_EXTENSIONS == '1'
        run: |
          source/villagesql/bld_tools/test_extension_vebs.sh \
            "$BUILD_DIR" \
            "$EXTS_ROOT/sources"

      - name: Package dev server tarball
        run: |
          mkdir -p "$OUTPUT_DIR"

          BUILD_DIR="$BUILD_DIR" \
          OUTPUT_DIR="$OUTPUT_DIR" \
          BUILD_BUNDLED_EXTENSIONS="${BUILD_BUNDLED_EXTENSIONS:-0}" \
            source/villagesql/bld_tools/package_dev_server.sh

      - name: Run integration tests
        if: env.RUN_INTEGRATION_TESTS == '1'
        run: |
          TARBALL=$(ls "$OUTPUT_DIR"/*.tar.gz | head -1)
          TEST_DIR=$(mktemp -d)
          tar xzf "$TARBALL" -C "$TEST_DIR"
          PACKAGE_DIR=$(echo "$TEST_DIR"/villagesql-dev-server-*)
          source/villagesql/dev_server/tests/integration_test.sh "$PACKAGE_DIR"
          rm -rf "$TEST_DIR"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devserver-${{ inputs.platform }}
          path: ${{ env.OUTPUT_DIR }}/*.tar.gz

      - name: Upload SDK
        if: env.UPLOAD_SDK == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-${{ inputs.platform }}
          path: ${{ env.BUILD_DIR }}/villagesql-extension-sdk-*.tar.gz
