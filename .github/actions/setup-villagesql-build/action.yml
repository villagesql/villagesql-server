name: 'Setup VillageSQL Build Environment'
description: 'Install dependencies and setup ccache for VillageSQL builds'

inputs:
  cache-key-prefix:
    description: 'Prefix for ccache key (e.g., "build", "nightly")'
    required: false
    default: 'build'
  setup-ccache:
    description: 'Whether to use GitHub Actions cache for ccache'
    required: false
    default: 'true'
  cache-boost:
    description: 'Whether to cache downloaded Boost sources at /tmp/boost'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Install build dependencies
      working-directory: ./source
      shell: bash
      run: |
        villagesql/bld_tools/setup_build_env.sh "${{ runner.os }}"

    - name: Cache Boost
      if: inputs.cache-boost == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: /tmp/boost
        key: boost-${{ runner.os }}-${{ runner.arch }}

    - name: Setup ccache
      if: inputs.setup-ccache == 'true'
      uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
      with:
        key: ${{ runner.os }}-${{ inputs.cache-key-prefix }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-key-prefix }}
        max-size: 5G
        verbose: 2
        append-timestamp: false
